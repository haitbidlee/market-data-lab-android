name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: unzip -q -o Market_Data_Lab_Android_Test_Source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build test APK
        working-directory: market-data-lab-android
        run: gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Data-Lab-test-APK
          path: market-data-lab-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
